      <div class="seg-btn ${d.aktivni===false?'on':''}" onclick="window._sbData.aktivni=false; renderSablonaSheet();">Vypnuto</div>
    </div>
    <div class="hint" style="margin:-2px 0 10px">Vypnutím appka přestane zakládat nové úkoly z téhle šablony. Už vygenerované úkoly a jejich historie zůstanou.</div>
    ` : ''}

    <div style="height:6px"></div>
    <button class="btn btn-primary" onclick="sbSave()">✓ Uložit pravidelný úkol</button>
    <button class="btn" onclick="renderSablonyListSheet()">← Zpět na seznam</button>
    ${!d._isNew ? `<button class="btn btn-danger" onclick="sbDelete('${d.id}')">Smazat pravidelný úkol</button>` : ''}
  `;
}
function sbSetFrekvence(f){
  window._sbData.frekvence = f;
  window._sbData.den = f==='tydne' ? 5 : 1;
  renderSablonaSheet();
}
function sbSave(){
  const d = window._sbData;
  if(!d.nazev.trim()){ toast('⚠ Zadej název pravidelného úkolu'); return; }
  delete d._isNew;
  const idx = sablony.findIndex(s=>s.id===d.id);
  if(idx>=0) sablony[idx]=d; else sablony.push(d);
  fbSet('ukoly_sablony', d.id, d);
  toast('✓ Pravidelný úkol uložen');
  renderSablonyListSheet();
}
function sbDelete(id){
  sablony = sablony.filter(s=>s.id!==id);
  fbDelete('ukoly_sablony', id);
  toast('🗑 Pravidelný úkol smazán (historie úkolů zůstává)');
  renderSablonyListSheet();
}

/* ============ RENDER: ÚKOLY ============ */
function renderUkoly(){
  const total = ukoly.length;
  const otevrene = ukoly.filter(u=>u.stav==='nove').length;
  const poTerminu = ukoly.filter(isOverdue).length;
  document.getElementById('ukol-stats').innerHTML = `
    <div class="stat-card"><div class="stat-val">${otevrene}</div><div class="stat-lbl">Otevřené</div></div>
    <div class="stat-card"><div class="stat-val" style="color:${poTerminu?'var(--red)':'inherit'}">${poTerminu}</div><div class="stat-lbl">Po termínu</div></div>
    <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-lbl">Celkem</div></div>`;

  document.getElementById('ukol-chips').innerHTML = `
    <button class="chip${ukolFilter==='moje'?' on':''}" onclick="setUkolFilter('moje')">${role==='sklad'?'Moje úkoly':'Vše'}</button>
    <button class="chip${ukolFilter==='po_terminu'?' on':''}" onclick="setUkolFilter('po_terminu')">Po termínu</button>
    <button class="chip${ukolFilter==='vyrizene'?' on':''}" onclick="setUkolFilter('vyrizene')">Vyřízené</button>
    ${role==='owner' ? `<button class="chip" onclick="openSablonyList()">🔁 Pravidelné úkoly</button>` : ''}`;

  let list = [...ukoly];
  if(role==='sklad'){
    list = list.filter(u=>u.resitel==='Martin' || u.zadavatel==='Martin');
  }
  if(ukolFilter==='po_terminu') list = list.filter(isOverdue);
  if(ukolFilter==='vyrizene') list = list.filter(u=>u.stav==='vyrizene');
  else if(ukolFilter==='moje') list = list.filter(u=>u.stav!=='vyrizene');

  list.sort((a,b)=> (isOverdue(b)-isOverdue(a)) || a.termin.localeCompare(b.termin));

  const el = document.getElementById('ukol-list');
  if(!list.length){ el.innerHTML = '<div class="empty">Žádné úkoly v tomhle výběru.</div>'; }
  else {
    el.innerHTML = list.map(u=>{
      const late = isOverdue(u);
      const stavClass = late ? 'item-late' : (u.stav==='vyrizene' ? 'item-vyrizene' : 'item-nove');
      return `<div class="item ${stavClass}" onclick="openUkol('${u.id}')">
        <div class="item-dot" style="background:${late?'var(--red)':(u.stav==='vyrizene'?'var(--pink)':'var(--green)')}"></div>
        <div class="item-body">
          <div class="item-title">${escapeHtml(u.nazev)} ${u.sablonaId?'<span class="pill pill-recurring">🔁 opakuje se</span>':''} ${late?'<span class="pill pill-late">Po termínu</span>':(u.stav==='vyrizene'?'<span class="pill pill-done">Vyřízeno</span>':'')}</div>
          <div class="item-meta">${u.zadavatel} → ${u.resitel} · termín ${fmtDate(u.termin)} ${u.komentare.length?`· 💬 ${u.komentare.length}`:''}</div>
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('fab-btn').textContent = '+ Nový úkol';
  document.getElementById('fab-btn').onclick = ()=>openUkol(null);
  document.getElementById('fab-wrap').style.display='block';
}
function setUkolFilter(v){ ukolFilter=v; renderUkoly(); }

function openUkol(id){
  const rec = id ? ukoly.find(u=>u.id===id) : null;
  const d = rec ? JSON.parse(JSON.stringify(rec)) : {id:uid(), nazev:'', popis:'', zadavatel: role==='sklad'?'Martin':'Lukáš', resitel: role==='sklad'?'Lukáš':'Ondřej', termin:todayStr(), priorita:'stredni', stav:'nove', komentare:[], foto:null, ts:Date.now(), _isNew:!rec};
  window._ukData = d;
  renderUkolSheet();
  openSheet();
}

function ukSyncFields(){
  const d = window._ukData;
  const g = id => document.getElementById(id);
  if(g('uk-nazev')) d.nazev = g('uk-nazev').value;
  if(g('uk-popis')) d.popis = g('uk-popis').value;
  if(g('uk-resitel')) d.resitel = g('uk-resitel').value;
  if(g('uk-termin')) d.termin = g('uk-termin').value;
}

function renderUkolSheet(){
  const d = window._ukData;
  const isNew = d._isNew;
  const resitelOptions = role==='sklad' ? ['Lukáš','Ondřej'] : ['Lukáš','Ondřej','Martin'];

  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <button class="close-x" onclick="closeSheet()">✕</button>
    <div class="sheet-title">${isNew?'Nový úkol':escapeHtml(d.nazev)}</div>
    <div class="sheet-sub">${isNew?'':'Zadal '+d.zadavatel+(isOverdue(d)?' · <span style="color:var(--red);font-weight:700">po termínu</span>':'')}${d.sablonaId?' · 🔁 opakující se úkol (nastavení v Pravidelných úkolech)':''}</div>

    <div class="field-lbl">Název</div>
    <input class="finp" id="uk-nazev" value="${escapeAttr(d.nazev)}" placeholder="Co je potřeba udělat">

    <div class="field-lbl">Popis</div>
    <textarea class="ftxt" id="uk-popis" placeholder="Detaily (nepovinné)">${escapeHtml(d.popis)}</textarea>

    <div class="row2">
      <div>
        <div class="field-lbl">Řešitel</div>
        <select class="fsel" id="uk-resitel">${resitelOptions.map(r=>`<option ${r===d.resitel?'selected':''}>${r}</option>`).join('')}</select>
      </div>
      <div>
        <div class="field-lbl">Termín</div>
        <input class="finp" type="date" id="uk-termin" value="${d.termin}">
      </div>
    </div>

    <div class="field-lbl">Priorita</div>
    <div class="seg">
      <div class="seg-btn ${d.priorita==='nizka'?'on':''}" onclick="ukSetPrio('nizka')">Nízká</div>
      <div class="seg-btn ${d.priorita==='stredni'?'on':''}" onclick="ukSetPrio('stredni')">Střední</div>
      <div class="seg-btn ${d.priorita==='vysoka'?'on':''}" onclick="ukSetPrio('vysoka')">Vysoká</div>
    </div>

    <div class="field-lbl">Foto</div>
    <div class="photo-box" onclick="document.getElementById('uk-foto-inp').click()">
      ${photoBoxInnerHtml(d.foto, '<div>📷 Klepni pro přidání fotky</div>')}
      <div class="hint">Nepovinné, ale doporučené u hlášení problémů</div>
    </div>
    <input type="file" accept="image/*" id="uk-foto-inp" style="display:none" onchange="ukPhoto(event)">

    ${!isNew ? `
    <div class="field-lbl">Komentáře</div>
    <div class="card" id="uk-comments">${renderComments(d.komentare)}</div>
    <div class="row2" style="grid-template-columns:1fr auto">
      <input class="finp" id="uk-newcomment" placeholder="Napsat komentář…">
      <button class="btn btn-primary" style="width:auto;padding:11px 16px" onclick="ukAddComment('${d.id}')">Odeslat</button>
    </div>
    ` : ''}

    <div style="height:6px"></div>
    ${d.stav==='nove' ? `<button class="btn btn-primary" onclick="ukSave('vyrizene')">✓ Uložit a označit Vyřízeno</button>`
                       : `<button class="btn" onclick="ukSave('nove')">↩ Vrátit na Nové</button>`}
    <button class="btn ${d.stav==='nove'?'':'btn-primary'}" onclick="ukSave('${d.stav}')">${d.stav==='nove'?'Uložit':'Uložit'}</button>
    ${(!isNew && role==='owner') ? `<button class="btn btn-danger" onclick="ukDelete('${d.id}')">Smazat úkol</button>` : ''}
  `;
  hydrateFotoLazy(sheet);
}
function renderComments(list){
  if(!list.length) return '<div class="empty" style="padding:14px">Zatím žádné komentáře.</div>';
  return list.map(c=>`<div class="comment"><div class="comment-who">${escapeHtml(c.autor)}</div><div class="comment-txt">${escapeHtml(c.text)}</div><div class="comment-ts">${new Date(c.ts).toLocaleString('cs-CZ')}</div></div>`).join('');
}
function ukSetPrio(p){ ukSyncFields(); window._ukData.priorita=p; renderUkolSheet(); }
function ukPhoto(ev){
  const file = ev.target.files[0]; if(!file) return;
  toast('⏳ Zpracovávám fotku…');
  compressImage(file).then(dataUrl=>{
    ukSyncFields();
    const d = window._ukData;
    if(!driveUploadEnabled()){
      d.foto = dataUrl;
      renderUkolSheet();
      return;
    }
    const item = {dataUrl, driveFileId:null, url:null, filename:null};
    d.foto = item;
    renderUkolSheet();
    const datum = todayStr();
    const slozka = driveSlozkaNazev(datum, 'Úkol - '+d.nazev);
    uploadFotoNaDrive(dataUrl, datum, slozka, 'ukol').then(res=>{
      item.driveFileId = res.driveFileId; item.url = res.url; item.filename = res.filename;
      renderUkolSheet();
    }).catch(()=>toast('⚠ Nahrání na Disk selhalo, fotka zůstává jen v appce'));
  });
}
function ukAddComment(id){
  const inp = document.getElementById('uk-newcomment');
  const txt = inp.value.trim();
  if(!txt) return;
  ukSyncFields();
  const autor = role==='sklad' ? 'Martin' : 'Lukáš';
  window._ukData.komentare.push({autor, text:txt, ts:Date.now()});
  const idx = ukoly.findIndex(u=>u.id===id);
  if(idx>=0){ ukoly[idx]=window._ukData; fbSet('ukoly', id, window._ukData); }
  renderUkolSheet();
  toast('💬 Komentář přidán');
}
function ukSave(stav){
  ukSyncFields();
  const d = window._ukData;
  d.nazev = d.nazev.trim();
  d.stav = stav;
  if(!d.nazev){ toast('⚠ Zadej název úkolu'); return; }
  if(driveUploadEnabled()){
    if(!fotoJeNahotova(d.foto)){
      toast('⏳ Fotka se ještě nahrává na Disk, počkej chvíli a zkus to znovu');
      return;
    }
    d.foto = stripPendingAndDataUrl(d.foto);
  }
  if(!docSizeOk(d)){ toast('⚠ Moc velká fotka — vyfoť znovu nebo ji smaž'); return; }
  const byloNoveUk = !!d._isNew;
  delete d._isNew;
  const idx = ukoly.findIndex(u=>u.id===d.id);
  if(idx>=0) ukoly[idx]=d; else ukoly.unshift(d);
  fbSet('ukoly', d.id, d); closeSheet(); renderUkoly();
  toast(stav==='vyrizene' ? '✓ Úkol vyřízen' : '✓ Uloženo');

  if(byloNoveUk) poslatNotifikaci('🆕 Nový úkol: '+d.nazev+' (řešitel: '+d.resitel+', termín '+fmtDate(d.termin)+')', [osobaRole(d.resitel)]);
  else if(stav==='vyrizene') poslatNotifikaci('✅ Úkol dokončen: '+d.nazev, [osobaRole(d.zadavatel)]);
  else poslatNotifikaci('✏️ Úkol upraven: '+d.nazev);
}
function ukDelete(id){
  const ukRec = ukoly.find(u=>u.id===id);
  ukoly = ukoly.filter(u=>u.id!==id);
  fbDelete('ukoly', id); closeSheet(); renderUkoly();
  toast('🗑 Smazáno');
  if(ukRec) poslatNotifikaci('🗑 Zrušen úkol: '+ukRec.nazev);
}

/* ============ RENDER: PLÁN PRÁCE ============ */
function planWeekNav(dir){ planWeekOffset+=dir; renderKapacita(); }

function sortQueue(){
  // Vykládky, kde se očekává nebo se ukázalo třídění, a ještě nejsou vyřízené — "kamiony čekající na vytřídění"
  return nakladky.filter(n=>n.typ==='vykladka' && n.stav==='nove' && (n.ocekavano==='trideni' || n.material.some(m=>(m.tridirna||0)>0)));
}

function renderQueue(){
  const queue = sortQueue();
  const el = document.getElementById('queue-list');
  if(!queue.length){ el.innerHTML = '<div class="empty" style="padding:16px">Žádné čekající kamiony na vytřídění.</div>'; return; }
  el.innerHTML = queue.map(n=>{
    const est = Math.max(1, n.material.filter(m=>(m.tridirna||0)>0).length);
    return `<div class="queue-card" style="cursor:pointer" onclick="openNakladka('${n.id}')">
      <div class="qc-title">🚚 ${escapeHtml(n.partner)} — ${fmtDate(n.datum)}</div>
      <div class="qc-meta">${n.material.map(m=>m.typ+' '+(m.realQty??m.dlQty)+'ks').join(', ')} · odhad ≈ ${est} dělníko-den${est>1?'y':''}</div>
    </div>`;
  }).join('');
}

function renderKapacita(){
  renderQueue();

  const monday = mondayOf(addDays(new Date(), planWeekOffset*7));
  const days = [...Array(7)].map((_,i)=>addDays(monday,i));
  const sunday = days[6];
  const f = d=>pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.';
  document.getElementById('plan-week-label').textContent = (planWeekOffset===0?'Tento týden · ':'') + f(monday)+' – '+f(sunday);

  if(!days.some(d=>dateToStr(d)===planSelDay)) planSelDay = dateToStr(days[0]);

  document.getElementById('plan-day-strip').innerHTML = days.map(d=>{
    const iso = dateToStr(d);
    const dots = WORKERS.filter(w=>workPlan[iso+'|'+w.name]).slice(0,4).map(w=>{
      const a = workPlan[iso+'|'+w.name];
      return `<div class="day-dot" style="background:${ACTIVITY[a.typ].color}"></div>`;
    }).join('');
    return `<div class="day-cell${iso===todayStr()?' today':''}${iso===planSelDay?' on':''}" onclick="planPickDay('${iso}')">
      <div class="day-wd">${WEEKDAY_CS[d.getDay()]}</div>
      <div class="day-num">${d.getDate()}</div>
      <div class="day-dots">${dots}</div>
    </div>`;
  }).join('');

  document.getElementById('plan-day-lbl').textContent = 'Rozpis · ' + fmtDate(planSelDay) + (planSelDay===todayStr()?' (dnes)':'');

  const canEdit = true; // rozpis teď smí zadat Ondra (owner) i Martin Bortlík (sklad) — viz workflow v5
  document.getElementById('plan-list').innerHTML = WORKERS.map(w=>{
    const a = workPlan[planSelDay+'|'+w.name];
    const act = a ? ACTIVITY[a.typ] : null;
    return `<div class="plan-row" ${canEdit?`onclick="openPlanCell('${w.name}')"`:''}>
      <div class="plan-dot" style="background:${w.color}"></div>
      <div class="plan-name">${w.name}</div>
      <div class="plan-assign">
        <div class="plan-assign-typ" style="color:${act?act.color:'var(--muted)'}">${act?act.label:'— nezadáno'}</div>
        ${a && a.poznamka ? `<div class="plan-assign-note">${escapeHtml(a.poznamka)}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  document.getElementById('fab-wrap').style.display='none';
}
function planPickDay(iso){ planSelDay=iso; renderKapacita(); }

function openPlanCell(workerName){
  const key = planSelDay+'|'+workerName;
  const cur = workPlan[key] || {typ:'trideni', vykladkaId:null, poznamka:''};
  const queue = sortQueue();

  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <button class="close-x" onclick="closeSheet()">✕</button>
    <div class="sheet-title">${workerName} — ${fmtDate(planSelDay)}</div>
    <div class="sheet-sub">Zadává Ondřej / Lukáš</div>

    <div class="field-lbl">Náplň dne</div>
    <div class="seg" id="pl-typ-seg">
      ${Object.entries(ACTIVITY).map(([k,v])=>`<div class="seg-btn ${cur.typ===k?'on':''}" data-v="${k}" onclick="plSetTyp(this)">${v.label}</div>`).join('')}
    </div>

    <div id="pl-vykladka-wrap" style="display:${cur.typ==='trideni'?'block':'none'}">
      <div class="field-lbl">Ke kterému kamionu (nepovinné)</div>
      <select class="fsel" id="pl-vykladka">
        <option value="">— neurčeno / obecně —</option>
        ${queue.map(n=>`<option value="${n.id}" ${cur.vykladkaId===n.id?'selected':''}>${escapeHtml(n.partner)} — ${fmtDate(n.datum)}</option>`).join('')}
      </select>
    </div>

    <div class="field-lbl">Poznámka</div>
    <input class="finp" id="pl-poznamka" value="${escapeAttr(cur.poznamka||'')}" placeholder="např. typ palety, o co jde">

    <button class="btn btn-primary" onclick="plSave('${workerName}')">Uložit</button>
    ${workPlan[key] ? `<button class="btn btn-danger" onclick="plClear('${workerName}')">Smazat rozpis pro tento den</button>` : ''}
  `;
  openSheet();
}
function plSetTyp(el){
  document.querySelectorAll('#pl-typ-seg .seg-btn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('pl-vykladka-wrap').style.display = el.dataset.v==='trideni' ? 'block' : 'none';
}
function plSave(workerName){
  const typ = document.querySelector('#pl-typ-seg .seg-btn.on').dataset.v;
  const vykladkaId = typ==='trideni' ? (document.getElementById('pl-vykladka').value || null) : null;
  const poznamka = document.getElementById('pl-poznamka').value;
  const key = planSelDay+'|'+workerName;
  workPlan[key] = {typ, vykladkaId, poznamka};
  fbSet('workplan', key, {typ, vykladkaId, poznamka, date:planSelDay, worker:workerName});
  closeSheet(); renderKapacita();
  toast('✓ Rozpis uložen');
}
function plClear(workerName){
  const key = planSelDay+'|'+workerName;
  delete workPlan[key];
  fbDelete('workplan', key);
  closeSheet(); renderKapacita();
  toast('🗑 Smazáno');
}

/* ============ RENDER: GALERIE (soukromý přehled nahraných fotek) ============
   Appka fotky nikdy veřejně nesdílí — náhledy tu jdou přes stejný soukromý
   Apps Script Web App jako u jednotlivých záznamů (viz nacistFotoNahled výš).
   Sbírá fotky ze všech nakládek/vykládek i úkolů, seřazené od nejnovějších,
   seskupené po jednotlivých záznamech (stejně jako složky na Disku — viz
   skupinaNadpis/skupinaSub níž), klepnutím na dlaždici se otevře příslušný
   záznam. */
function galerieCollect(){
  const items = [];
  nakladky.forEach(n=>{
    const skupiny = [
      [n.dlFoto ? [n.dlFoto] : [], 'Foto dodacího listu'],
      [n.fotoSklad||[], 'Foto – sklad'],
      [n.fotoTridirna||[], 'Foto – třídírna'],
      [n.fotoOpravna||[], 'Foto – opravna'],
    ];
    const skupinaKlic = 'nakladka:'+n.id;
    const skupinaNadpis = nkPartnerDisplay(n);
    const skupinaSub = nkTypLabel(n.typ)+' · '+fmtDate(n.datum);
    const skupinaBarva = nkTypColor(n.typ);
    skupiny.forEach(([arr, popis])=>{
      arr.forEach(p=>{
        if(!p) return;
        if(!photoPreviewSrc(p) && !(p && typeof p==='object' && p.driveFileId)) return;
        items.push({p, zdroj:'nakladka', id:n.id, datum:n.datum, popis, skupinaKlic, skupinaNadpis, skupinaSub, skupinaBarva});
      });
    });
  });
  ukoly.forEach(u=>{
    const p = u.foto;
    if(!p) return;
    if(!photoPreviewSrc(p) && !(p && typeof p==='object' && p.driveFileId)) return;
    items.push({p, zdroj:'ukol', id:u.id, datum:u.termin, popis:'Foto u úkolu', skupinaKlic:'ukol:'+u.id, skupinaNadpis:u.nazev||'Úkol', skupinaSub:'Úkol · '+fmtDate(u.termin), skupinaBarva:'#8e8e93'});
  });
  items.sort((a,b)=>(b.datum||'').localeCompare(a.datum||''));
  return items;
}
function galerieTileHtml(it, idx){
  const titleTxt = it.skupinaNadpis+' · '+it.popis;
  const src = photoPreviewSrc(it.p);
  if(src) return `<div class="gal-tile" onclick="galerieOtevri(${idx})" title="${escapeAttr(titleTxt)}"><img src="${src}"></div>`;
  const fid = it.p && typeof it.p==='object' && it.p.driveFileId;
  if(fid) return `<div class="gal-tile" data-foto-lazy="${fid}" onclick="galerieOtevri(${idx})" title="${escapeAttr(titleTxt)}"><div class="photo-thumb-loading">⏳</div></div>`;
  return '';
}
function renderGalerie(){
  document.getElementById('fab-wrap').style.display='none';
  const items = galerieCollect();
  window._galerieItems = items;
  const list = document.getElementById('galerie-list');
  if(!items.length){ list.innerHTML = '<div class="empty" style="padding:16px">Zatím žádné nahrané fotky.</div>'; return; }
  const order = [], groups = {};
  items.forEach((it,idx)=>{
    const key = it.skupinaKlic;
    if(!groups[key]){ groups[key]={info:it, idxs:[]}; order.push(key); }
    groups[key].idxs.push(idx);
  });
  list.innerHTML = order.map(key=>{
    const g = groups[key];
    return `<div class="gal-group">
      <div class="gal-group-hdr">
        <div class="gal-group-dot" style="background:${g.info.skupinaBarva}"></div>
        <div>
          <div class="gal-group-title">${escapeHtml(g.info.skupinaNadpis)}</div>
          <div class="gal-group-sub">${escapeHtml(g.info.skupinaSub)}</div>
        </div>
      </div>
      <div class="gal-grid">${g.idxs.map(i=>galerieTileHtml(items[i], i)).join('')}</div>
    </div>`;
  }).join('');
  hydrateFotoLazy(list);
}
function galerieOtevri(idx){
  const it = window._galerieItems && window._galerieItems[idx];
  if(!it) return;
  if(it.zdroj==='nakladka') openNakladka(it.id); else openUkol(it.id);
}

/* ============ RENDER: TO-DO (rychlý osobní seznam) ============
   Každý vidí a upravuje jen svoje položky (filtr podle person) — jednoduchý
   soukromý seznam k rychlému zapsání, náhrada papírku. Bez termínu/přiřazení,
   jen text + hotovo/nehotovo. */
function renderTodo(){
  document.getElementById('fab-wrap').style.display='none';
  const mine = todoItems.filter(t=>t.person===person);
  const otevrene = mine.filter(t=>!t.done).sort((a,b)=>b.ts-a.ts);
  const hotove = mine.filter(t=>t.done).sort((a,b)=>b.ts-a.ts);

  const itemHtml = t => `<div class="todo-item ${t.done?'done':''}">
      <div class="todo-check" onclick="toggleTodo('${t.id}')">${t.done?'✓':''}</div>
      <div class="todo-text" onclick="toggleTodo('${t.id}')">${escapeHtml(t.text)}</div>
      <button class="todo-del" onclick="deleteTodo('${t.id}')">✕</button>
    </div>`;

  const el = document.getElementById('todo-list');
  let html = '';
  if(!otevrene.length && !hotove.length){
    html = '<div class="empty">Zatím žádné poznámky. Napiš první nahoře ⤴</div>';
  } else {
    html += otevrene.map(itemHtml).join('');
    if(hotove.length){
      html += `<div class="todo-sep">Hotovo (${hotove.length})</div>`;
      html += hotove.map(itemHtml).join('');
    }
  }
  el.innerHTML = html;
}
function addTodo(){
  const inp = document.getElementById('todo-input');
  const text = inp.value.trim();
  if(!text) return;
  const item = {id:uid(), person, text, done:false, ts:Date.now()};
  fbSet('todo', item.id, item);
  inp.value='';
  inp.focus();
}
function toggleTodo(id){
  const t = todoItems.find(x=>x.id===id);
  if(!t) return;
  fbSet('todo', id, {...t, done:!t.done});
}
function deleteTodo(id){
  fbDelete('todo', id);
}

/* ============ SHEET HELPERS ============ */
function openSheet(){ document.getElementById('overlay').classList.add('on'); }
function closeSheet(){ document.getElementById('overlay').classList.remove('on'); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ============ INIT ============ */
function renderAll(){
  generujOpakujiciUkoly();
  const s = activeScreen();
  if(s==='prehled') renderPrehled();
  if(s==='nakladky') renderNakladky();
  if(s==='ukoly') renderUkoly();
  if(s==='kapacita') renderKapacita();
  if(s==='galerie') renderGalerie();
  if(s==='todo') renderTodo();
  if(s==='profitabilita') renderProfitabilita();
}
