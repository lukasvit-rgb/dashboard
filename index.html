<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<title>Dashboard Palety Vít</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f2f7;--bg2:#ffffff;--bg3:#e8e8ed;--bg4:#d8d8dd;
  --border:#cccccc;--ink:#111111;--dim:#888888;--muted:#bbbbbb;
  --green:#27ae60;--red:#e05555;--yellow:#e6a800;--blue:#2980b9;--pink:#d6336c;
  --hh:52px;
  --tabbar-h:58px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:'Barlow',sans-serif;min-height:100vh;max-width:100%;margin:0 auto;touch-action:manipulation}
button,input,textarea,select{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* HEADER */
.header{height:calc(var(--hh) + env(safe-area-inset-top));background:#ffffff;border-bottom:1px solid var(--border);padding:env(safe-area-inset-top) 14px 0;box-sizing:border-box;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo-wrap{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:flex;flex-direction:column;line-height:1}
.logo-top{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;letter-spacing:4px;color:#111111}
.logo-bot{display:flex;gap:8px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;letter-spacing:4px;color:#111111}
.role-switch{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{width:32px;height:32px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0}
.seg-pill{display:flex;background:var(--bg3);border-radius:20px;padding:2px}
.seg-pill-btn{padding:6px 11px;background:none;border:none;border-radius:18px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);cursor:pointer}
.seg-pill-btn.on{background:var(--ink);color:#fff}
.user-badge{display:flex;align-items:center;gap:8px}
.user-badge-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink);white-space:nowrap}

/* PŘIHLÁŠENÍ */
.login-overlay{position:fixed;inset:0;background:var(--bg);z-index:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.login-box{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
.login-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;letter-spacing:5px;text-align:center;margin-bottom:6px}
.login-box input{font-family:'Barlow',sans-serif;font-size:15px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);background:#fff;color:var(--ink);width:100%}
.login-box input:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.login-btn{padding:13px;background:var(--ink);color:#fff;border:none;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-err{font-size:12.5px;color:var(--red);font-weight:700;min-height:16px;text-align:center}

/* BOTTOM TAB BAR (nativní app navigace) */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:#ffffff;border-top:1px solid var(--border);z-index:150;padding-bottom:env(safe-area-inset-bottom)}
.tabbar-btn{flex:1;height:var(--tabbar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--dim);cursor:pointer}
.tabbar-btn .ic{font-size:21px;line-height:1}
.tabbar-btn .lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.tabbar-btn.on{color:var(--ink)}

/* DEMO BANNER */
.demo-banner{background:#fff8e6;border-bottom:1px solid #f0d98a;color:#7a5c00;font-size:11.5px;font-weight:700;padding:7px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;display:flex;align-items:center;gap:5px}

/* SCREENS */
.screen{display:none;padding:14px 14px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 90px)}
.screen.on{display:block}
.sec-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim);padding:12px 0 6px}
.sec-lbl:first-child{padding-top:0}

/* WEEK STRIP */
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.week-nav-btn{width:36px;height:36px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;font-size:16px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.week-nav-btn:active{background:var(--bg3)}
.week-nav-label{flex:1;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;letter-spacing:.5px;color:var(--dim)}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}
.day-cell{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:8px 2px;text-align:center;cursor:pointer;position:relative}
.day-cell.today{border-color:var(--ink)}
.day-cell.on{background:var(--ink);border-color:var(--ink)}
.day-cell.on .day-wd,.day-cell.on .day-num{color:#fff}
.day-wd{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.day-num{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;margin-top:1px}
.day-dots{display:flex;justify-content:center;gap:2px;margin-top:4px;height:6px}
.day-dot{width:5px;height:5px;border-radius:50%}

/* CARDS / LIST ITEMS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:8px}
.item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 13px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;margin-bottom:7px;transition:transform .1s}
.item:active{transform:scale(.985)}
.item-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px}
.item-body{flex:1;min-width:0}
.item-title{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item-meta{font-size:12px;color:var(--dim);margin-top:2px}
.item-note{font-size:12.5px;font-weight:700;color:var(--yellow);margin-top:3px;line-height:1.4}
.item-side{text-align:right;flex-shrink:0}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.pill-new{background:#e5f5ec;color:var(--green)}
.pill-done{background:#fbe6f0;color:var(--pink)}
.pill-late{background:#fbe9e9;color:var(--red)}
.pill-recurring{background:#eef2e6;color:#5c7a3a}
.empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:14px}

/* CELÉ BUŇKY BAREVNĚ PODLE STAVU (úkoly, nakládky/vykládky) */
.item-nove{background:#eaf8f0;border-color:#bce3cc}
.item-vyrizene{background:#fdebf3;border-color:#f0bcd8}
.item-late{background:#fdecec;border-color:#f0bcbc}

/* TO-DO (rychlý osobní seznam, soukromý pro každého přihlášeného) */
.todo-add-row{display:flex;gap:8px;margin-bottom:14px}
.todo-add-row .finp{flex:1}
.todo-add-btn{width:46px;flex-shrink:0;background:var(--ink);color:#fff;border:none;border-radius:9px;font-size:24px;line-height:1;cursor:pointer}
.todo-add-btn:active{opacity:.8}
.todo-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:11px 12px;display:flex;align-items:center;gap:10px;margin-bottom:7px}
.todo-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;cursor:pointer;background:var(--bg2)}
.todo-item.done .todo-check{background:var(--green);border-color:var(--green)}
.todo-text{flex:1;font-size:15px;word-break:break-word;cursor:pointer}
.todo-item.done .todo-text{color:var(--muted);text-decoration:line-through}
.todo-del{width:28px;height:28px;flex-shrink:0;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
.todo-sep{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin:16px 0 8px}

/* CHIPS */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:7px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .12s}
.chip.on{background:var(--bg3);color:var(--ink);border-color:var(--ink)}
.chip-dot{width:8px;height:8px;border-radius:50%}

/* STATS */
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900}
.stat-lbl{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-top:2px}

/* FAB */
.fab-wrap{position:fixed;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:100%;max-width:100%;padding:10px 16px;background:linear-gradient(transparent, #f2f2f7 30%);z-index:140}
.fab{width:100%;padding:15px;background:var(--ink);color:#ffffff;border:none;border-radius:12px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer}
.fab:active{opacity:.85}

/* MODAL / SHEET */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:200;align-items:flex-end}
.overlay.on{display:flex}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.sheet-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;margin-bottom:2px}
.sheet-sub{font-size:12px;color:var(--dim);margin-bottom:14px}
.field-lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dim);padding:10px 0 5px}
.field-lbl:first-of-type{padding-top:0}
.finp,.fsel,.ftxt{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:11px 12px;font-size:15px}
.ftxt{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;gap:6px;margin-bottom:4px}
.seg-btn{flex:1;padding:10px 4px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);cursor:pointer;text-align:center}
.seg-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.material-row{display:grid;grid-template-columns:1.3fr .8fr .8fr auto;gap:6px;align-items:center;margin-bottom:6px}
.material-row select,.material-row input{padding:8px;font-size:13px}
.mat-row-del{width:32px;height:32px;border-radius:8px;background:var(--bg2);border:1px solid var(--border);color:var(--red);font-size:15px;font-weight:700;cursor:pointer;padding:0;flex-shrink:0}
.stredisko-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.stredisko-cell{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center}
.stredisko-cell .lbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.stredisko-cell input{width:100%;border:none;background:transparent;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;padding:4px 0}
.photo-box{border:1.5px dashed var(--border);border-radius:9px;background:var(--bg2);text-align:center;padding:16px;cursor:pointer;margin-bottom:4px}
.photo-box img{max-width:100%;max-height:160px;border-radius:6px;display:block;margin:0 auto}
.photo-box .hint{font-size:12px;color:var(--dim);margin-top:6px}
.btn{padding:12px;border-radius:9px;border:1px solid var(--border);background:var(--bg2);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;width:100%;margin-top:6px}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn-danger{color:var(--red)}
.btn-row{display:flex;gap:8px}
.btn-row .btn{margin-top:6px}
.close-x{position:absolute;top:14px;right:14px;background:none;border:none;font-size:20px;color:var(--dim);cursor:pointer;padding:4px}

/* COMMENTS */
.comment{padding:9px 0;border-bottom:1px solid var(--border)}
.comment:last-child{border-bottom:none}
.comment-who{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800}
.comment-txt{font-size:14px;margin-top:1px}
.comment-ts{font-size:10px;color:var(--muted);margin-top:2px}

/* WORKER / CAPACITY */
.worker-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:7px}
.worker-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.worker-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;flex:1}
.worker-status{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.absence-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.absence-item:last-child{border-bottom:none}

/* PLÁN PRÁCE */
.plan-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 13px;margin-bottom:7px;cursor:pointer}
.plan-row:active{transform:scale(.985)}
.plan-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.plan-name{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;flex:1}
.plan-assign{text-align:right}
.plan-assign-typ{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:.5px}
.plan-assign-note{font-size:12px;font-weight:700;color:var(--yellow);margin-top:2px;max-width:170px;white-space:normal;line-height:1.35}
.queue-card{background:#fff8e6;border:1px solid #f0d98a;border-radius:10px;padding:11px 13px;margin-bottom:7px}
.queue-card .qc-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:#7a5c00}
.queue-card .qc-meta{font-size:12px;color:#8a6d1f;margin-top:1px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.photo-thumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--border);flex-shrink:0}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;line-height:1;padding:0}
.photo-add{width:72px;height:72px;border:1.5px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--dim);cursor:pointer;background:var(--bg2);flex-shrink:0}
.photo-file{position:relative;width:72px;height:72px;border-radius:8px;border:1px solid var(--border);flex-shrink:0;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;padding:2px;overflow:hidden}
.photo-file .pf-name{font-size:8px;color:var(--dim);line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.photo-thumb-badge{position:absolute;top:2px;left:2px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;line-height:1}
.photo-thumb-loading{color:var(--dim);font-size:12px;text-align:center;padding:14px 4px}
.photo-thumb .photo-thumb-loading,.gal-tile .photo-thumb-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;padding:0}
.gal-group{margin-bottom:16px}
.gal-group-hdr{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.gal-group-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px}
.gal-group-title{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700}
.gal-group-sub{font-size:12px;color:var(--dim);margin-top:1px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.gal-tile{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--border);cursor:pointer;background:var(--bg2)}
.gal-tile img{width:100%;height:100%;object-fit:cover;display:block}
.checklist-row{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:13px}

.toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:var(--green);color:#ffffff;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;letter-spacing:1px;padding:11px 20px;border-radius:8px;z-index:300;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}

/* PŘEHLED (denní souhrn firmy) */
.snap-note{background:#fff8e6;border:1px solid #f0d98a;border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:600;color:#7a5c00;margin-bottom:10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snap-note-more{font-weight:800;text-decoration:underline;text-underline-offset:2px}
.ov-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 15px;margin-bottom:10px}
.ov-big{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;line-height:1}
.ov-sub{font-size:11px;color:var(--dim);margin-top:2px}
.ov-mini-row{display:flex;gap:8px;margin-top:10px}
.ov-mini{flex:1;background:var(--bg3);border-radius:9px;padding:8px 10px}
.ov-mini-lbl{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif;font-weight:700}
.ov-mini-val{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;margin-top:1px}
.ov-plus{color:var(--green)}
.ov-minus{color:var(--red)}
.ov-breakdown{margin-top:10px;display:flex;flex-direction:column;gap:3px}
.ov-brow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid var(--bg3)}
.ov-brow:last-child{border-bottom:none}
.ov-brow-val{font-weight:700;font-family:'Barlow Condensed',sans-serif}
.ov-flag{display:inline-block;margin-top:8px;font-size:11px;color:#7a5c00;background:#fff8e6;border:1px solid #f0d98a;border-radius:6px;padding:5px 8px;line-height:1.4}
.ov-day-hdr{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin:10px 0 4px}
.ov-day-hdr:first-child{margin-top:0}

/* PROFITABILITA (jen Lukáš) */
.rent-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px}

<script type="module">

let dbReady = false;
const loaded = {nakladky:false, ukoly:false, workplan:false, zakaznici:false, sablony:false, todo:false};
function workPlanKeyFromDoc(id, data){ return (data.date||'')+'|'+(data.worker||''); }

function maybeFinishLoading(){
  if(dbReady) return;
  if(Object.values(loaded).every(Boolean)){
    dbReady = true;
    document.getElementById('loading-overlay').style.display='none';
    renderAll();
  }
}
function seedIfEmpty(colName, seedFn, keyFn){
  const rows = seedFn();
  rows.forEach(r => fbSet(colName, keyFn(r), r));
}
// Pozn. (13.9.2026): dřív se tu při prázdné kolekci vždycky znovu vložila ukázková
// data (seedIfEmpty/seedNakladky/seedUkoly/seedZakaznici/seedWorkPlan) — mělo to

// nasypala znovu. Proto se smazané nakládky/úkoly po resetu appky vracely. Appka teď
// běží naostro, takže se prázdná kolekce už znovu nezaplňuje — seed funkce zůstávají
// v kódu nepoužité, jen pro referenci.

/* ============ OPAKUJÍCÍ SE ÚKOLY (šablony → automaticky generované záznamy v "ukoly") ============
   Šablona popisuje pravidelnost (týdně v konkrétní den / měsíčně v konkrétní den).
   Appka při každém načtení dat zkontroluje, jestli pro aktuální období (týden/měsíc)
   už existuje vygenerovaný úkol z dané šablony — pokud ne, vytvoří ho. ID vygenerovaného
   úkolu je odvozené (šablonaId+období), takže i když appku mají otevřenou dva lidi
   najednou, oba se pokusí zapsat stejný dokument, ne dva duplicitní záznamy. */
const DEN_TYDNE_NAZEV = ['','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota','Neděle']; // index 1-7 (ISO, 1=Po)
function sablonaObdobi(s, d){
  if(s.frekvence==='mesicne') return d.getFullYear()+'-'+pad2(d.getMonth()+1);
  return dateToStr(mondayOf(d)); // týdně: datum pondělí toho týdne = klíč období
}
function sablonaTermin(s, d){
  if(s.frekvence==='mesicne'){
    const rok=d.getFullYear(), mesic=d.getMonth();
    const posledniDen = new Date(rok, mesic+1, 0).getDate();
    return dateToStr(new Date(rok, mesic, Math.min(s.den||1, posledniDen)));
  }
  return dateToStr(addDays(mondayOf(d), (s.den||5)-1));
}
function generujOpakujiciUkoly(){
  if(!loaded.ukoly || !loaded.sablony) return;
  const dnes = new Date();
  sablony.filter(s=>s.aktivni!==false).forEach(s=>{
    const obdobi = sablonaObdobi(s, dnes);
    if(ukoly.some(u=>u.sablonaId===s.id && u.obdobi===obdobi)) return;
    const novy = {
      id: s.id+'__'+obdobi,
      nazev: s.nazev, popis: s.popis||'',
      zadavatel: s.zadavatel||'Systém', resitel: s.resitel,
      termin: sablonaTermin(s, dnes), priorita: s.priorita||'stredni',
      stav:'nove', komentare:[], foto:null, ts:Date.now(),
      sablonaId: s.id, obdobi,
    };
    ukoly.unshift(novy);
    fbSet('ukoly', novy.id, novy);
  });
}

function docSizeOk(obj, limitBytes){
  limitBytes = limitBytes || 900000; // bezpečná rezerva pod 1 MiB limitem Firestore dokumentu
  try { return JSON.stringify(obj).length < limitBytes; } catch(e){ return true; }

function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1000; quality = quality || 0.55;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============ FOTKY NA GOOGLE DRIVE ============
   Apps Script Web App jako prostředník — appka nezná žádný servisní klíč,

/* ============ SOUKROMÝ NÁHLED ULOŽENÝCH FOTEK ============
   Appka fotky po uložení dřív vůbec nezobrazovala (jen odkaz "na Disku") — teď
   umí dotáhnout reálný náhled přes stejný Apps Script Web App (soukromý, běží
   pod Lukášovým účtem), akcí 'nahled'. Fronta omezuje počet souběžných
   požadavků (Apps Script má limit na počet paralelních běhů na účet), cache
   drží výsledky, aby se stejná fotka nenačítala opakovaně. */
const fotoNahledCache = {}; // driveFileId -> Promise<dataUrl|null>
let fotoNahledAktivnich = 0;
const FOTO_NAHLED_MAX_SOUBEZNE = 3;
const fotoNahledFronta = [];
function fotoNahledFrontaTick(){
  while(fotoNahledAktivnich < FOTO_NAHLED_MAX_SOUBEZNE && fotoNahledFronta.length){
    fotoNahledAktivnich++;
    fotoNahledFronta.shift()();
  }
}
function nacistFotoNahled(driveFileId){
  if(!driveFileId || !driveUploadEnabled()) return Promise.resolve(null);
  if(fotoNahledCache[driveFileId]) return fotoNahledCache[driveFileId];
  const p = new Promise(resolve=>{
    fotoNahledFronta.push(()=>{
      fetch(DRIVE_UPLOAD_URL, {method:'POST', body: JSON.stringify({akce:'nahled', driveFileId})})
        .then(r=>r.json())
        .then(res=>resolve(res && res.dataUrl ? res.dataUrl : null))
        .catch(()=>resolve(null))
        .finally(()=>{ fotoNahledAktivnich--; fotoNahledFrontaTick(); });
    });
  });
  fotoNahledCache[driveFileId] = p;
  fotoNahledFrontaTick();
  return p;
}
// scopeEl: element, ve kterém se právě vykreslily placeholdery <div data-foto-lazy="ID">
// s vnořeným <div class="photo-thumb-loading">. Po dotažení náhledu se placeholder
// nahradí <img>; při selhání (appka offline, smazáno na Disku…) se ukáže náhradní
// ikonka se jménem souboru, aby appka nezůstala navěky "načítám".
function hydrateFotoLazy(scopeEl){
  if(!scopeEl) return;
  scopeEl.querySelectorAll('[data-foto-lazy]').forEach(el=>{
    const id = el.getAttribute('data-foto-lazy');
    if(!id || el.dataset.fotoLazyBusy) return;
    el.dataset.fotoLazyBusy = '1';
    nacistFotoNahled(id).then(dataUrl=>{
      const ph = el.querySelector('.photo-thumb-loading');
      if(dataUrl){
        const img = document.createElement('img');
        img.src = dataUrl;
        if(ph) ph.replaceWith(img); else el.prepend(img);
      } else if(ph){
        const fn = el.getAttribute('data-foto-fn') || '';
        ph.outerHTML = fn
          ? `<div style="font-size:20px">📄</div><div class="hint" style="margin:2px 0 0">${escapeHtml(fn)}</div>`
          : `<div class="hint" style="margin:0">⚠ náhled nedostupný</div>`;
      }
      el.removeAttribute('data-foto-lazy');
    });
  });
}
// p může být: null, 'demo' (ukázková data), starý base64 string (záznamy před zavedením Drive),
// nebo nový objekt {dataUrl?, driveFileId, url, filename} — dataUrl jen dočasně, po dobu editace.
function photoPreviewSrc(p){
  if(!p) return null;
  if(p==='demo') return demoPhotoDataUri();
  if(typeof p === 'string') return p;
  if(p.dataUrl) return p.dataUrl;
  return null; // uložený záznam bez dataUrl — appka fotku dál nezobrazuje, jen odkaz na Disk
}
function photoFilenameOf(p){
  return (p && typeof p==='object' && p.filename) ? p.filename : null;
}
function photoBoxInnerHtml(p, placeholderHtml){
  const src = photoPreviewSrc(p);
  if(src) return `<img src="${src}">`;
  const fid = p && typeof p==='object' && p.driveFileId;
  if(fid){
    const fn = photoFilenameOf(p) || '';
    return `<div data-foto-lazy="${fid}" data-foto-fn="${escapeAttr(fn)}"><div class="photo-thumb-loading">⏳ Načítám náhled…</div></div>`;
  }
  const fn = photoFilenameOf(p);
  if(fn) return `<div style="font-size:28px">📄</div><div>${escapeHtml(fn)}</div><div class="hint">✓ na Disku</div>`;
  return placeholderHtml;
}
// true = fotka je připravená k uložení (hotová/legacy/prázdná), false = ještě čeká na dokončení uploadu
function fotoJeNahotova(p){
  return !(p && typeof p==='object' && !p.driveFileId);
}
function stripPendingAndDataUrl(p){
  if(p && typeof p==='object') return {driveFileId:p.driveFileId, url:p.url, filename:p.filename};
  return p;
}

  // Profitabilita i Plán práce jsou dočasně schované ze záložek (17.9.2026 — teď

  document.getElementById('tab-profitabilita').style.display = 'none';

/* ============ RENDER: PŘEHLED (denní souhrn firmy) ============ */
function computePrehledData(){
  const now = new Date();
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const isToday = ts => { const t = new Date(ts); return !isNaN(t) && t >= today0; };

  // --- KASA (appka Pokladna, kolekce pokladna+pokladna_meta, projekt vykup-palet) ---
  // Stejná logika jako appka Pokladna sama (renderBalances): zůstatek = ukotvená
  // hodnota + oficiální příjmy/výdaje od data ukotvení − výkupy od data ukotvení
  // (výkupy se platí z oficiální kasy). Neoficiální kasa se do zůstatku nepočítá.
  let oficialniZustatek = null, ukotvenoDatum = null;
  let dnesPrijem = 0, dnesVydaj = 0, neoficialniPrijem = 0, neoficialniVydaj = 0;
  if (pokladnaAnchor && pokladnaAnchor.date){
    let bal = Number(pokladnaAnchor.official) || 0;
    pokladnaTx.forEach(t=>{
      if(!t.ts || t.ts < pokladnaAnchor.date) return;
      const amt = Number(t.amt)||0;
      if(t.kasa!=='unofficial'){ if(t.typ==='income') bal+=amt; else bal-=amt; }
    });
    vykupyData.forEach(v=>{
      if(!v.ts || v.ts < pokladnaAnchor.date) return;
      bal -= Number(v.total)||0;
    });
    oficialniZustatek = bal;
    const [ay,am,ad] = pokladnaAnchor.date.split('-');
    ukotvenoDatum = ad+'. '+am+'. '+ay;
  }
  pokladnaTx.forEach(t=>{
    if(!t.ts || !isToday(t.ts)) return;
    const amt = Number(t.amt)||0;
    if(t.kasa==='unofficial'){ if(t.typ==='income') neoficialniPrijem+=amt; else neoficialniVydaj+=amt; }
    else { if(t.typ==='income') dnesPrijem+=amt; else dnesVydaj+=amt; }
  });
  vykupyData.forEach(v=>{ if(v.ts && isToday(v.ts)) dnesVydaj += Number(v.total)||0; });

  // --- VÝKUP (appka Výkup palet, kolekce vykupy, projekt vykup-palet) ---
  const vykupToday = vykupyData.filter(v=>v.ts && isToday(v.ts));
  const vykupPolozkyMap = {};
  vykupToday.forEach(v=>(v.items||[]).forEach(it=>{
    vykupPolozkyMap[it.n] = (vykupPolozkyMap[it.n]||0) + (Number(it.ks)||0);
  }));

  // --- OPRAVY (appka Evidence oprav, kolekce opravy, projekt evidence-oprav) ---
  const todayStrVal = todayStr();
  const opravyToday = opravyData.filter(o=>o.date===todayStrVal);
  const delnikMap = {}, typMap = {};
  opravyToday.forEach(o=>{
    const jm = o.workerName || ('Pracovník #'+(o.worker??'?'));
    delnikMap[jm] = (delnikMap[jm]||0) + (Number(o.qty)||0);
    typMap[o.palletType] = (typMap[o.palletType]||0) + (Number(o.qty)||0);
  });

  return {
    kasa: { oficialniZustatek, ukotvenoDatum, dnesPrijem, dnesVydaj, neoficialniPrijem, neoficialniVydaj, chyba: pokladnaError },
    vykup: {
      celkemKc: vykupToday.reduce((s,v)=>s+(Number(v.total)||0),0),
      pocetZaznamu: vykupToday.length,
      polozky: Object.entries(vykupPolozkyMap).map(([n,ks])=>({n,ks})).sort((a,b)=>b.ks-a.ks),
      chyba: vykupyError,
    },
    opravy: {
      celkemKs: opravyToday.reduce((s,o)=>s+(Number(o.qty)||0),0),
      pocetZaznamu: opravyToday.length,
      podleDelnika: Object.entries(delnikMap).map(([n,ks])=>({n,ks})).sort((a,b)=>b.ks-a.ks),
      podleTypu: Object.entries(typMap).map(([n,ks])=>({n,ks})).sort((a,b)=>b.ks-a.ks),
      chyba: opravyError,
    },
  };
}

/* ============ RENDER: PROFITABILITA (jen Lukáš) ============
   Zisk z výkupů = (prodejní cena/ks − výkupní cena/ks − fixní náklad/ks) × ks,
   sečteno přes položky výkupů (appka Výkup palet). Fixní náklad je 68 Kč/ks u
   poškozených typů, jinak 13 Kč/ks — stejná logika jako appka Palety (Rentabilita).
   Prodejní ceny jsou sdílené a editovatelné jen tady, uložené ve Firestore
   (projekt vykup-palet, kolekce sell_prices/config) — vyžaduje vlastní pravidlo. */
function vykupPalletByName(n){ return VYKUP_PALLETS.find(p=>p.n===n) || null; }

function setProfPeriod(p){ profPeriod = p; renderProfitabilita(); }

function profFilterRecords(){
  const now = new Date();
  let from = null;
  if(profPeriod==='today'){ from = new Date(now.getFullYear(),now.getMonth(),now.getDate()); }
  else if(profPeriod==='week'){ from = mondayOf(now); from.setHours(0,0,0,0); }
  else if(profPeriod==='month'){ from = new Date(now.getFullYear(),now.getMonth(),1); }
  return vykupyData.filter(v=>{
    if(!v.ts) return false;
    if(!from) return true;
    return new Date(v.ts) >= from;
  });
}

function profCalc(){
  const records = profFilterRecords();
  let profit = 0, ksTotal = 0, unknownKs = 0;
  const perType = {};
  records.forEach(v=>(v.items||[]).forEach(it=>{
    const pallet = vykupPalletByName(it.n);
    const ks = Number(it.ks)||0;
    ksTotal += ks;
    if(!pallet){ unknownKs += ks; return; }
    const isDmg = VYKUP_DAMAGED_IDS.includes(pallet.id);
    const fixCost = isDmg ? 68 : 13;
    const sellPrice = Number(sellPrices[pallet.id]) || 0;
    const purchCost = Number(it.pr)||0;
    const rowProfit = (sellPrice - purchCost - fixCost) * ks;
    profit += rowProfit;
    perType[pallet.id] = perType[pallet.id] || {n:pallet.n, ks:0, profit:0};
    perType[pallet.id].ks += ks;
    perType[pallet.id].profit += rowProfit;
  }));
  return { profit, ksTotal, unknownKs, records: records.length, perType: Object.values(perType).sort((a,b)=>b.ks-a.ks) };
}

function renderProfitabilita(){
  const kc = n => Math.round(n).toLocaleString('cs-CZ')+' Kč';

  document.getElementById('prof-period-chips').innerHTML = `
    <button class="chip${profPeriod==='today'?' on':''}" onclick="setProfPeriod('today')">Dnes</button>
    <button class="chip${profPeriod==='week'?' on':''}" onclick="setProfPeriod('week')">Tento týden</button>
    <button class="chip${profPeriod==='month'?' on':''}" onclick="setProfPeriod('month')">Tento měsíc</button>
    <button class="chip${profPeriod==='all'?' on':''}" onclick="setProfPeriod('all')">Vše</button>
  `;

  if(!sellPricesLoaded){
    document.getElementById('prof-result').innerHTML = `<div class="empty">Načítám ceny…</div>`;
  } else {
    const c = profCalc();
    document.getElementById('prof-result').innerHTML = `
      <div class="profit-card">
        <div>
          <div class="profit-lbl">Čistý zisk</div>
          <div class="profit-val ${c.profit>=0?'pos':'neg'}">${kc(c.profit)}</div>
        </div>
        <div style="text-align:right;font-size:12px;color:#ccc">${c.records} výkupy<br>${c.ksTotal} ks</div>
      </div>
      <div class="ov-breakdown">
        ${c.perType.length? c.perType.map(p=>`<div class="ov-brow"><span>${p.n}</span><span class="ov-brow-val">${kc(p.profit)} (${p.ks} ks)</span></div>`).join('') : '<div class="empty">V tomhle období žádný výkup.</div>'}
      </div>
      ${c.unknownKs?`<div class="ov-flag">⚠ ${c.unknownKs} ks nešlo přiřadit ke známému typu palety — nezapočítáno do zisku.</div>`:''}
      ${vykupyError?'<div class="ov-flag">⚠ Výkupy se nepodařilo načíst živě (výpadek připojení k appce Výkup palet).</div>':''}
    `;
  }

  let priceNote = '';
  if(sellPricesError){
    priceNote = `<div class="ov-flag">⚠ Uložení prodejní ceny se nepovedlo — v projektu vykup-palet chybí Firestore pravidlo pro kolekci <code>sell_prices</code>. Přidej v konzoli Firebase (stejně jako u tridici_protokoly): <code>match /sell_prices/{doc} { allow read, write: if true; }</code></div>`;
  }
  document.getElementById('prof-note').innerHTML = `<div style="font-size:12px;color:var(--dim);margin-bottom:8px">Prodejní ceny za kus jsou sdílené a používají se pro výpočet zisku výše. Vidí a upravuje je jen tahle záložka.</div>${priceNote}`;

  document.getElementById('prof-prices').innerHTML = VYKUP_PALLETS.map(p=>{
    const isDmg = VYKUP_DAMAGED_IDS.includes(p.id);
    const val = sellPrices[p.id]!=null ? sellPrices[p.id] : '';
    return `<div class="rent-row">
      <div class="rent-name">${p.n}${isDmg?' <span style="color:var(--dim);font-weight:400">(poškozená)</span>':''}</div>
      <input class="rent-inp" type="number" inputmode="decimal" value="${val}" placeholder="0" onchange="saveSellPriceProf('${p.id}',this.value)">
    </div>`;
  }).join('');
}

function saveSellPriceProf(id, val){
  const n = Number(val)||0;
  sellPrices[id] = n;
  setDoc(doc(vpdb,'sell_prices','config'), {[id]: n}, {merge:true}).then(()=>{
    sellPricesError = false;
  }).catch(e=>{
    console.error('saveSellPriceProf', e);
    sellPricesError = true;
    renderProfitabilita();
  });
}

function renderWeekStrip(){
  const monday = addDays(mondayOf(new Date()), weekOffset*7);
  const days = [...Array(7)].map((_,i)=>addDays(monday,i));
  const sunday = days[6];
  const f = d=>pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.';
  document.getElementById('week-label').textContent = (weekOffset===0?'Tento týden · ':'') + f(monday)+' – '+f(sunday);

  document.getElementById('week-strip').innerHTML = days.map(d=>{
    const iso=dateToStr(d);
    const items = nakladky.filter(n=>n.datum===iso);
    const dots = items.slice(0,3).map(n=>`<div class="day-dot" style="background:${nkTypColor(n.typ)}"></div>`).join('');
    return `<div class="day-cell${iso===todayStr()?' today':''}${iso===selDay?' on':''}" onclick="pickDay('${iso}')">
      <div class="day-wd">${WEEKDAY_CS[d.getDay()]}</div>
      <div class="day-num">${d.getDate()}</div>
      <div class="day-dots">${dots}</div>
    </div>`;
  }).join('');
}
function pickDay(iso){ selDay=iso; renderNakladky(); }

function renderNakladky(){
  renderWeekStrip();
  document.getElementById('nak-chips').innerHTML = `
    <button class="chip${nakFilter==='all'?' on':''}" onclick="setNakFilter('all')">Celý týden</button>
    <button class="chip${nakFilter==='den'?' on':''}" onclick="setNakFilter('den')">Jen ${fmtDate(selDay)}</button>
    <button class="chip${nakFilter==='nove'?' on':''}" onclick="setNakFilter('nove')">Nové</button>
    <button class="chip${nakFilter==='vyrizene'?' on':''}" onclick="setNakFilter('vyrizene')">Vyřízené</button>`;

  const monday = dateToStr(addDays(mondayOf(new Date()), weekOffset*7));
  const sunday = dateToStr(addDays(mondayOf(new Date()), weekOffset*7+6));
  let list = nakladky.filter(n=>n.datum>=monday && n.datum<=sunday);
  if(nakFilter==='den') list = list.filter(n=>n.datum===selDay);
  if(nakFilter==='nove') list = list.filter(n=>n.stav==='nove');
  if(nakFilter==='vyrizene') list = list.filter(n=>n.stav==='vyrizene');
  list.sort((a,b)=> a.datum===b.datum ? a.cas.localeCompare(b.cas) : a.datum.localeCompare(b.datum));

  const el = document.getElementById('nak-list');
  if(!list.length){ el.innerHTML='<div class="empty">Žádné záznamy v tomhle výběru.</div>'; }
  else{
    el.innerHTML = list.map(n=>{
      const matSum = n.material.map(m=>m.typ+' '+(m.realQty??m.dlQty)+'ks').join(', ');
      return `<div class="item ${n.stav==='vyrizene'?'item-vyrizene':'item-nove'}" onclick="openNakladka('${n.id}')">
        <div class="item-dot" style="background:${nkTypColor(n.typ)}"></div>
        <div class="item-body">
          <div class="item-title">${nkTypLabel(n.typ)} · ${nkPartnerDisplay(n)}
            <span class="pill ${n.stav==='vyrizene'?'pill-done':'pill-new'}">${n.stav==='vyrizene'?'Vyřízeno':'Nové'}</span>
          </div>
          <div class="item-meta">${fmtDate(n.datum)} ${n.cas} · ${matSum}</div>
          ${n.poznamka ? `<div class="item-note">📝 ${escapeHtml(n.poznamka)}</div>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  const fab = document.getElementById('fab-btn');
  if(role==='owner'){
    fab.textContent='+ Nový záznam';
    fab.onclick=()=>openNakladka(null);
    document.getElementById('fab-wrap').style.display='block';
  } else {
    document.getElementById('fab-wrap').style.display='none';
  }
}
function setNakFilter(v){ nakFilter=v; renderNakladky(); }

function openNakladka(id){
  const rec = id ? nakladky.find(n=>n.id===id) : null;
  const data = rec ? JSON.parse(JSON.stringify(rec)) : {id:uid(), typ:'vykladka', datum:selDay, cas:'09:00', partner:'', dodavatel:'', zakaznik:'', adresaNakladky:'', adresaVykladky:'', poznamka:'', stav:'nove', ocekavano:'ok', material:[{typ:PALLETS[0], dlQty:'', realQty:null, tridirna:null, sklad:null, opravna:null}], dlFoto:null, fotoSklad:[], fotoTridirna:[], fotoOpravna:[], neshodaKomentar:'', zalozil: person, ts:Date.now(), _isNew:!rec};
  window._nkData = data;
  window._nkAddingCustomer = false;
  window._nkNewCustName = '';
  window._nkNewCustMats = [];
  window._nkAddingDod = false; window._nkNewDodName=''; window._nkNewDodMats=[];
  window._nkAddingZak = false; window._nkNewZakName=''; window._nkNewZakMats=[];
  renderNakladkaSheet();
  openSheet();

function nkSyncFields(){
  const d = window._nkData;
  const g = id => document.getElementById(id);
  if(g('nk-datum')) d.datum = g('nk-datum').value;
  if(g('nk-cas')) d.cas = g('nk-cas').value;
  if(g('nk-partner')) d.partner = g('nk-partner').value;
  if(g('nk-dodavatel')) d.dodavatel = g('nk-dodavatel').value;
  if(g('nk-zakaznik')) d.zakaznik = g('nk-zakaznik').value;
  if(g('nk-adresa-nakladky')) d.adresaNakladky = g('nk-adresa-nakladky').value;
  if(g('nk-adresa-vykladky')) d.adresaVykladky = g('nk-adresa-vykladky').value;
  if(g('nk-poznamka')) d.poznamka = g('nk-poznamka').value;
  if(g('nk-neshoda-komentar')) d.neshodaKomentar = g('nk-neshoda-komentar').value;
}

function nkNeshoda(d){
  return d.typ==='vykladka' && d.ocekavano==='ok' && d.material.some(m=>(m.tridirna||0)>0 || (m.opravna||0)>0);
}
function nkTotals(d){
  let sklad=0, tridirna=0, opravna=0, realMissing=false, dlMissing=false, protokolOk=true;
  d.material.forEach(m=>{
    sklad += m.sklad||0; tridirna += m.tridirna||0; opravna += m.opravna||0;
    if(m.realQty==null || m.realQty==='') realMissing = true;
    if(m.dlQty===''||m.dlQty==null) dlMissing = true;
    if(m.realQty!=null && ((m.tridirna||0)+(m.sklad||0)+(m.opravna||0)) !== m.realQty) protokolOk = false;
  });
  return {sklad,tridirna,opravna,realMissing,dlMissing,protokolOk};
}

function nkNeshodaHtml(data){
  if(!nkNeshoda(data)) return '';
  return `
    <div class="queue-card" style="background:#fbe9e9;border-color:#f0b3b3">
      <div class="qc-title" style="color:var(--red)">⚠ Neshoda s domluveným stavem</div>
      <div class="qc-meta" style="color:#a33">Bylo domluveno "OK — rovnou sklad", ale rozpad ukazuje třídění/opravu. Fotky níže a komentář budou potřeba jako doklad vůči dodavateli.</div>
    </div>
    <div class="field-lbl">Komentář k neshodě</div>
    <textarea class="ftxt" id="nk-neshoda-komentar" placeholder="Co přesně nesedí a v jakém rozsahu" oninput="window._nkData.neshodaKomentar=this.value; nkRefreshDynamic();">${escapeHtml(data.neshodaKomentar||'')}</textarea>
  `;
}
function nkPhotoTileHtml(p, field, i){
  const del = `<button type="button" class="photo-thumb-del" onclick="nkRemovePhoto('${field}',${i})">✕</button>`;
  const src = photoPreviewSrc(p);
  if(src){
    const pending = (p && typeof p==='object' && !p.driveFileId) ? `<div class="photo-thumb-badge">⏳</div>` : '';
    return `<div class="photo-thumb"><img src="${src}">${pending}${del}</div>`;
  }
  const fid = p && typeof p==='object' && p.driveFileId;
  if(fid){
    const fn = photoFilenameOf(p) || '';
    return `<div class="photo-thumb" data-foto-lazy="${fid}" data-foto-fn="${escapeAttr(fn)}"><div class="photo-thumb-loading">⏳</div>${del}</div>`;
  }
  const fn = photoFilenameOf(p);
  if(fn) return `<div class="photo-file">📄<div class="pf-name">${escapeHtml(fn)}</div>${del}</div>`;
  return `<div class="photo-thumb">${del}</div>`;
}
function nkPhotoGridHtml(data, field, label, hint, minCount){
  const arr = data[field] || [];
  const count = arr.length;
  return `
    <div class="field-lbl">${label} ${minCount?`<span style="color:${count>=minCount?'var(--green)':'var(--red)'}">(${count}/${minCount})</span>`:''}</div>
    <div class="photo-grid">
      ${arr.map((p,i)=>nkPhotoTileHtml(p,field,i)).join('')}
      <div class="photo-add" onclick="document.getElementById('nk-inp-${field}').click()">📷<br>přidat</div>
    </div>
    <input type="file" accept="image/*" multiple id="nk-inp-${field}" style="display:none" onchange="nkAddPhotos(event,'${field}')">
    ${hint?`<div class="hint" style="margin:-2px 0 10px">${hint}</div>`:''}
  `;
}
function nkPhotoTriggers(data){
  const t = nkTotals(data);
  return {
    sklad: t.sklad>0 || data.ocekavano==='ok',
    tridirna: t.tridirna>0 || data.ocekavano==='trideni',
    opravna: t.opravna>0 || data.ocekavano==='oprava',
  };
}
function nkPhotosHtml(data){
  if(data.typ!=='vykladka') return '';
  const trig = nkPhotoTriggers(data);
  let html = '';
  if(trig.sklad) html += nkPhotoGridHtml(data,'fotoSklad','Foto dobrých palet (rovnou na sklad)','Dokumentace stavu palet bez závad',2);
  if(trig.tridirna) html += nkPhotoGridHtml(data,'fotoTridirna','Foto poškozených palet k třídění','Vyfoť nejvíc poškozené kusy z dodávky',6);
  if(trig.opravna) html += nkPhotoGridHtml(data,'fotoOpravna','Foto kamionu / stavu palet pro opravnu','Jak palety vypadaly při vyložení',2);
  return html;
}
function nkChecklist(d){
  const t = nkTotals(d);
  const trig = nkPhotoTriggers(d);
  const items = [];
  if(d.typ==='vykladka'){
    items.push({label:'Foto dodacího listu', ok: !!d.dlFoto});
    items.push({label:'Počty podle DL i reálně vyplněné u všech položek', ok: !t.dlMissing && !t.realMissing});
    if(trig.sklad) items.push({label:`Foto dobrých palet — min. 2 (${(d.fotoSklad||[]).length}/2)`, ok:(d.fotoSklad||[]).length>=2});
    if(trig.tridirna) items.push({label:`Foto poškozených palet k třídění — min. 6 (${(d.fotoTridirna||[]).length}/6)`, ok:(d.fotoTridirna||[]).length>=6});
    if(trig.opravna){
      items.push({label:`Foto kamionu pro opravnu — min. 2 (${(d.fotoOpravna||[]).length}/2)`, ok:(d.fotoOpravna||[]).length>=2});
      items.push({label:'Třídicí protokol kompletní (rozpad sedí na reálný počet)', ok: t.protokolOk});
    }
    if(nkNeshoda(d)) items.push({label:'Komentář k neshodě vyplněný', ok: !!(d.neshodaKomentar||'').trim()});
  } else {
    items.push({label:'Vyplněno, co se má naložit (počet ks u všech položek)', ok: !t.dlMissing});
    items.push({label:'Po naložení doplněný skutečný počet ks u všech položek', ok: !t.realMissing});
  }
  return items;
}
function nkCanClose(d){
  const items = nkChecklist(d);
  return items.every(i=>i.ok);
}
function nkChecklistHtml(d){
  const items = nkChecklist(d);
  if(!items.length) return '';
  const allOk = items.every(i=>i.ok);
  return `
    <div class="card" style="border-color:${allOk?'#bfe3cc':'#f0d98a'};background:${allOk?'#eaf7ef':'#fff8e6'}">
      <div class="field-lbl" style="padding-top:0;color:${allOk?'#1d7a41':'#7a5c00'}">Podmínky pro "Uložit a označit Vyřízeno"</div>
      ${items.map(i=>`<div class="checklist-row"><span style="color:${i.ok?'var(--green)':'var(--red)'};font-weight:800">${i.ok?'✓':'✗'}</span><span>${i.label}</span></div>`).join('')}
    </div>
  `;
}
function nkRefreshDynamic(){
  const d = window._nkData;
  document.getElementById('nk-neshoda-block').innerHTML = nkNeshodaHtml(d);
  const photosBlock = document.getElementById('nk-photos-block');
  photosBlock.innerHTML = nkPhotosHtml(d);
  hydrateFotoLazy(photosBlock);
  document.getElementById('nk-checklist-block').innerHTML = nkChecklistHtml(d);
  const btn = document.getElementById('nk-close-btn');
  if(btn) btn.disabled = !nkCanClose(d);
}
function nkAddPhotos(ev, field){
  const files = Array.from(ev.target.files||[]);
  if(!files.length) return;
  toast('⏳ Zpracovávám fotky…');
  const d = window._nkData;
  Promise.all(files.map(f=>compressImage(f))).then(dataUrls=>{
    if(!driveUploadEnabled()){
      d[field] = (d[field]||[]).concat(dataUrls);
      nkRefreshDynamic();
      return;
    }
    const typBase = {fotoSklad:'sklad', fotoTridirna:'tridirna', fotoOpravna:'opravna'}[field] || field;
    const startIdx = (d[field]||[]).length;
    const items = dataUrls.map(dataUrl=>({dataUrl, driveFileId:null, url:null, filename:null}));
    d[field] = (d[field]||[]).concat(items);
    nkRefreshDynamic();
    const slozka = driveSlozkaNazevZakazka(d.partner, d.datum);
    items.forEach((item,i)=>{
      uploadFotoNaDrive(item.dataUrl, d.datum, slozka, fotoTypNazev(typBase, startIdx+i+1)).then(res=>{
        item.driveFileId = res.driveFileId; item.url = res.url; item.filename = res.filename;
        nkRefreshDynamic();
      }).catch(()=>toast('⚠ Nahrání na Disk selhalo, fotka zůstává jen v appce'));
    });
  });
  ev.target.value = '';
}
function nkRemovePhoto(field, idx){
  const d = window._nkData;
  const arr = d[field]||[];
  const removed = arr[idx];
  d[field] = arr.filter((_,i)=>i!==idx);
  if(removed && removed.driveFileId) smazatFotoZDrive(removed.driveFileId);
  nkRefreshDynamic();
}

function nkPartnerFieldHtml(data, canEditPlan){
  if(!canEditPlan){
    return `<input class="finp" value="${escapeAttr(data.partner)}" disabled>`;
  }
  const matched = zakaznici.find(z=>z.nazev===data.partner);
  const addingNew = !!window._nkAddingCustomer;
  const manualMode = !addingNew && !matched && !!data.partner;
  let html = `
    <select class="finp" id="nk-partner-select" onchange="nkPartnerSelect(this.value)">
      <option value="" ${!matched && !manualMode && !addingNew ? 'selected':''}>— vyber ze seznamu —</option>
      ${[...zakaznici].sort((a,b)=>a.nazev.localeCompare(b.nazev)).map(z=>`<option value="${z.id}" ${matched && matched.id===z.id ? 'selected':''}>${escapeHtml(z.nazev)}</option>`).join('')}
      <option value="__manual__" ${manualMode?'selected':''}>Jiná firma (nezadat do databáze)</option>
      <option value="__new__" ${addingNew?'selected':''}>+ Nový zákazník…</option>
    </select>
  `;
  if(manualMode){
    html += `<input class="finp" id="nk-partner" style="margin-top:8px" placeholder="Název firmy" value="${escapeAttr(data.partner)}" oninput="window._nkData.partner=this.value">`;
  }
  if(addingNew){
    html += nkNewCustomerFormHtml();
  }
  return html;
}

  nkSyncFields();

    renderNakladkaSheet(); return;

/* ============ PŘEKUP: dvojice polí dodavatel/zákazník (stejný vzor jako nkPartnerFieldHtml,
   ale parametrizovaný přes 'key', protože Překup potřebuje OBĚ firmy zvlášť, ne jednu společnou) */
function nkPartyStateKeys(key){
  return key==='dodavatel'
    ? {adding:'_nkAddingDod', name:'_nkNewDodName', mats:'_nkNewDodMats'}
    : {adding:'_nkAddingZak', name:'_nkNewZakName', mats:'_nkNewZakMats'};
}
function nkPartyFieldHtml(data, canEditPlan, key){
  if(!canEditPlan){
    return `<input class="finp" value="${escapeAttr(data[key]||'')}" disabled>`;
  }
  const sk = nkPartyStateKeys(key);
  const matched = zakaznici.find(z=>z.nazev===data[key]);
  const addingNew = !!window[sk.adding];
  const manualMode = !addingNew && !matched && !!data[key];
  let html = `
    <select class="finp" id="nk-${key}-select" onchange="nkPartySelect('${key}',this.value)">
      <option value="" ${!matched && !manualMode && !addingNew ? 'selected':''}>— vyber ze seznamu —</option>
      ${[...zakaznici].sort((a,b)=>a.nazev.localeCompare(b.nazev)).map(z=>`<option value="${z.id}" ${matched && matched.id===z.id ? 'selected':''}>${escapeHtml(z.nazev)}</option>`).join('')}
      <option value="__manual__" ${manualMode?'selected':''}>Jiná firma (nezadat do databáze)</option>
      <option value="__new__" ${addingNew?'selected':''}>+ Nový zákazník…</option>
    </select>
  `;
  if(manualMode){
    html += `<input class="finp" id="nk-${key}" style="margin-top:8px" placeholder="Název firmy" value="${escapeAttr(data[key]||'')}" oninput="window._nkData['${key}']=this.value">`;
  }
  if(addingNew){
    html += nkNewPartyFormHtml(key);
  }
  return html;
}
function nkNewPartyFormHtml(key){
  const sk = nkPartyStateKeys(key);
  const mats = window[sk.mats] || [];
  return `
    <div class="card" style="margin-top:8px">
      <div class="field-lbl" style="padding-top:0">Nový zákazník</div>
      <input class="finp" id="nk-newparty-${key}-name" placeholder="Název firmy" value="${escapeAttr(window[sk.name]||'')}" oninput="window['${sk.name}']=this.value">
      <div class="field-lbl">Obvyklý materiál (lze víc)</div>
      <div class="chips">
        ${PALLETS.map(p=>`<button type="button" class="chip${mats.includes(p)?' on':''}" onclick="nkToggleNewPartyMat('${key}','${p}')">${p}</button>`).join('')}
      </div>
      <div style="height:6px"></div>
      <button class="btn btn-primary" onclick="nkSaveNewParty('${key}')">✓ Uložit zákazníka a použít</button>
      <button class="btn" onclick="nkCancelNewParty('${key}')">Zrušit</button>
    </div>
  `;
}
function nkToggleNewPartyMat(key,p){

function nkPartySelect(key,value){

function renderMaterialRows(){
  const d = window._nkData;
  const canEditPlan = role==='owner';
  const el = document.getElementById('nk-material');
  el.innerHTML = d.material.map((m,i)=>`
    <div class="material-row">
      <select onchange="nkMatField(${i},'typ',this.value)" ${canEditPlan?'':'disabled'}>

      <input type="number" inputmode="numeric" placeholder="${d.typ==='vykladka'?'reálně':'naloženo'}" value="${m.realQty??''}" oninput="nkMatField(${i},'realQty',this.value)">
      ${canEditPlan?`<button type="button" class="mat-row-del" onclick="nkRemoveMaterialRow(${i})" title="Smazat typ palety">✕</button>`:''}

      <div class="stredisko-cell"><div class="lbl" style="color:${STREDISKA.tridirna.color}">Třídírna</div><input type="number" inputmode="numeric" value="${m.tridirna??''}" oninput="nkMatField(${i},'tridirna',this.value)"></div>
      <div class="stredisko-cell"><div class="lbl" style="color:${STREDISKA.sklad.color}">Sklad</div><input type="number" inputmode="numeric" value="${m.sklad??''}" oninput="nkMatField(${i},'sklad',this.value)"></div>
      <div class="stredisko-cell"><div class="lbl" style="color:${STREDISKA.opravna.color}">Opravna</div><input type="number" inputmode="numeric" value="${m.opravna??''}" oninput="nkMatField(${i},'opravna',this.value)"></div>
    </div>` : ''}
  `).join('');
}
function nkMatField(i,field,val){
  window._nkData.material[i][field] = (field==='typ') ? val : (val===''?null:parseInt(val));
  // realQty/tridirna/sklad/opravna ovlivňují banner neshody a přiřazení dělníků — překreslí se jen ty dva bloky, ne celý sheet (jinak by to shazovalo focus při psaní)
  if(['realQty','tridirna','sklad','opravna'].includes(field)) nkRefreshDynamic();
}
function nkAddMaterialRow(){
  window._nkData.material.push({typ:PALLETS[0], dlQty:'', realQty:null, tridirna:null, sklad:null, opravna:null});
  renderMaterialRows();
}
function nkRemoveMaterialRow(i){
  window._nkData.material.splice(i,1);
  renderMaterialRows();
  nkRefreshDynamic();
}
function nkPhoto(ev,field){
  const file = ev.target.files[0];
  if(!file) return;
  toast('⏳ Zpracovávám fotku…');
  compressImage(file).then(dataUrl=>{
    nkSyncFields();
    const d = window._nkData;
    if(!driveUploadEnabled()){
      d[field] = dataUrl;
      renderNakladkaSheet();
      return;
    }
    const item = {dataUrl, driveFileId:null, url:null, filename:null};
    d[field] = item;
    renderNakladkaSheet();
    const slozka = driveSlozkaNazevZakazka(d.partner, d.datum);
    uploadFotoNaDrive(dataUrl, d.datum, slozka, fotoTypNazev(field==='dlFoto'?'dl':field, 1)).then(res=>{
      item.driveFileId = res.driveFileId; item.url = res.url; item.filename = res.filename;
      renderNakladkaSheet();
    }).catch(()=>toast('⚠ Nahrání na Disk selhalo, fotka zůstává jen v appce'));
  });
}

function nkSave(stav){
  nkSyncFields();
  const d = window._nkData;

  if(stav==='vyrizene' && !nkCanClose(d)){
    toast('⚠ Nejdou splněné podmínky pro Vyřízeno — zkontroluj checklist');
    return;
  }

  if(driveUploadEnabled()){
    const arrFields = ['fotoSklad','fotoTridirna','fotoOpravna'];
    const pending = !fotoJeNahotova(d.dlFoto) || arrFields.some(f=>(d[f]||[]).some(p=>!fotoJeNahotova(p)));
    if(pending){
      toast('⏳ Fotky se ještě nahrávají na Disk, počkej chvíli a zkus to znovu');
      return;
    }
    d.dlFoto = stripPendingAndDataUrl(d.dlFoto);
    arrFields.forEach(f=>{ d[f] = (d[f]||[]).map(stripPendingAndDataUrl); });
  }

  if(!docSizeOk(d)){
    toast('⚠ Moc velké fotky — smaž pár fotek nebo je vyfoť znovu (méně detailně) a zkus to znovu');
    return;
  }

  const byloNove = !!d._isNew;
  d.stav = stav;
  delete d._isNew;
  d.provedl = person; // kdo fyzicky nakládal/vykládal — vždy přepsáno na aktuálně přihlášeného, bez ručního zadávání
  const idx = nakladky.findIndex(n=>n.id===d.id);
  if(idx>=0) nakladky[idx]=d; else nakladky.unshift(d);

  fbSet('nakladky', d.id, d);
  closeSheet(); renderNakladky();
  toast(stav==='vyrizene' ? '✓ Označeno jako vyřízeno' : '✓ Uloženo');

  const typLabel = nkTypLabel(d.typ);
  const isM = nkTypGenderM(d.typ);
  const nkPopis = nkPartnerDisplay(d)+' – '+fmtDate(d.datum)+(d.cas?' '+d.cas:'');
  if(byloNove) poslatNotifikaci('🆕 Nov'+(isM?'ý':'á')+' '+typLabel.toLowerCase()+': '+nkPopis, nkJeDnesNeboZitra(d.datum)?['martin']:[]);
  else if(stav==='vyrizene') poslatNotifikaci('✅ '+typLabel+(isM?' vyřízen: ':' vyřízena: ')+nkPopis);
  else poslatNotifikaci('✏️ '+typLabel+(isM?' upraven: ':' upravena: ')+nkPopis, ['martin']);
}
function nkDelete(id){
  const rec = nakladky.find(n=>n.id===id);
  nakladky = nakladky.filter(n=>n.id!==id);
  fbDelete('nakladky', id);
  closeSheet(); renderNakladky();
  toast('🗑 Smazáno');
  if(rec) poslatNotifikaci('🗑 Zrušen'+(nkTypGenderM(rec.typ)?'':'a')+' '+nkTypLabel(rec.typ).toLowerCase()+': '+nkPartnerDisplay(rec)+' – '+fmtDate(rec.datum), ['martin']);
}

  `;

function zkToggleMat(p){
  const d = window._zkData;
  d.materialy = d.materialy || [];

function zkSave(){
